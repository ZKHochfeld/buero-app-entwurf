/* Layout: Arbeitsoberfläche mit Kopfleiste, eine Spalte bis Tablet, Kachelraster für die Bereiche. Farben aus dem CD des Kulturzentrums. */
:root{
  --bg:#fbf4e2; --surface:#fffdf7; --surface-2:#f4e8cb; --fg:#3a1c0c; --muted:#6b4a35; --line:#e3d2ab;
  --accent:#c4271a; --accent-fill:#e63323; --on-accent:#140700; --hi:#f4b740;
  --ok:#2c6e45; --ok-bg:#e3f1e6; --warn-bg:#fdf0c9; --crit:#b3261e; --crit-bg:#fbe1dc;
  --font:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b0d05; --surface:#26140a; --surface-2:#33200f; --fg:#f4e8cb; --muted:#cdb58f; --line:#4a2e18;
  --accent:#ff7a66; --accent-fill:#e63323; --on-accent:#140700; --hi:#f4b740;
  --ok:#8fd6a6; --ok-bg:#16301f; --warn-bg:#3a2d0c; --crit:#ff8f80; --crit-bg:#3d1712; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1b0d05; --surface:#26140a; --surface-2:#33200f; --fg:#f4e8cb; --muted:#cdb58f; --line:#4a2e18;
  --accent:#ff7a66; --accent-fill:#e63323; --on-accent:#140700; --hi:#f4b740;
  --ok:#8fd6a6; --ok-bg:#16301f; --warn-bg:#3a2d0c; --crit:#ff8f80; --crit-bg:#3d1712; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.demo{background:var(--hi);color:#140700;font-size:13px;font-weight:600;text-align:center;padding:6px 12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto;display:flex;gap:8px;align-items:center}
.brand i{display:inline-block;width:14px;height:14px;background:var(--accent-fill);border-radius:3px}
nav{display:flex;flex-wrap:wrap;gap:4px}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
nav button{border-color:transparent;background:transparent}
nav button[aria-current="page"]{background:var(--surface-2);font-weight:600}
.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:600}
.primary:hover{border-color:var(--fg)}
.small{padding:4px 9px;font-size:13px}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
h1{font-size:28px;line-height:1.15;margin:4px 0 4px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px;margin:26px 0 10px;font-weight:800;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.muted{color:var(--muted)}
.sub{color:var(--muted);margin:0 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cols>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);border-color:transparent}
.chip.pub{background:transparent;border-style:dashed}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.list li:first-child{border-top:0}
.list .main{min-width:0;flex:1 1 220px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-height:112px}
.tile:hover{border-color:var(--accent)}
.tile .k{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:13px}
.tile.mine .k{background:var(--accent-fill);color:var(--on-accent)}
.tile .n{font-weight:600}
.tile .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.tile.locked{background:transparent;border-style:dashed}
.big{font-variant-numeric:tabular-nums;font-weight:800}
.crumb{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 12px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 10px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent-fill);font-weight:600}
.grid2{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;align-items:center}
.box{border-radius:var(--r);padding:10px 12px;background:var(--warn-bg)}
.box.crit{background:var(--crit-bg)}
.box.ok{background:var(--ok-bg)}
.box p{margin:4px 0}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:60px}
.grow{flex:1 1 220px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.day{margin-top:14px}
.day h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ev{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-left:4px solid var(--c);background:var(--surface);border-radius:0 8px 8px 0;margin-top:6px;flex-wrap:wrap}
.ev time{font-variant-numeric:tabular-nums;font-weight:600;min-width:92px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c)}
.bell{position:relative}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--accent-fill);color:var(--on-accent);font-size:11px;border-radius:999px;padding:1px 6px}
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:100%;margin-top:6px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;z-index:20}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100vw - 32px)}
.check{display:flex;gap:8px;align-items:center;padding:4px 0}
.check input{width:18px;height:18px}
.done{text-decoration:line-through;color:var(--muted)}
.login{max-width:520px;margin:40px auto}
.ms{display:flex;gap:10px;align-items:center;font-weight:600}
.ms i{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}
.ms i span:nth-child(1){background:#f25022}.ms i span:nth-child(2){background:#7fba00}.ms i span:nth-child(3){background:#00a4ef}.ms i span:nth-child(4){background:#ffb900}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.people button{text-align:left;padding:10px 12px}
.help ol{padding-left:20px}.help li{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.tile,button{transition:border-color .15s}}
@media (max-width:640px){
  header.top{position:static}
  header.top .in{gap:6px 8px;padding-block:8px}
  .brand{flex-basis:100%;font-size:16px}
  nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}
  nav button{padding:6px 8px;white-space:nowrap}
  .bell,header.top .in>button[data-act="logout"]{padding:5px 9px;font-size:13px}
  h1{font-size:24px}
}
</style>

 const v=V.find(x=>x.p===p&&x.tag===wt(a.datum)&&x.von<=a.von&&x.bis>=a.bis);
 return v?{ok:true,txt:v.art==='fest'?'Arbeitszeit':'freiwillig'}:{ok:false,txt:'keine Zeit eingetragen'};
}
function konflikte(){const r=[],rb=E.filter(e=>e.cal==='rb'&&e.von);
 for(let i=0;i<rb.length;i++)for(let j=i+1;j<rb.length;j++){const x=rb[i],y=rb[j];
  if(x.d===y.d&&x.o===y.o&&x.von<y.bis&&y.von<x.bis)r.push([x,y])}return r}
function hinweise(){const me=S.me,h=[];
 A.forEach(a=>{

  else if(a.p===me&&open(a)&&a.frist&&a.frist>=HEUTE&&a.frist<='2026-11-21')h.push({a,t:'Frist naht: '+a.t+' ('+fd(a.frist)+')'});
  if(a.fn&&!a.fg&&open(a)&&canFg(a.b))h.push({a,t:'Freigabe fehlt: '+a.t});
 });return h}

 if(a.z)c+='<span class="chip'+(a.z==='zugesagt'?' ok':a.z==='abgesagt'?' crit':' warn')+'">'+(a.z==='angefragt'?'Zusage offen':a.z)+'</span>';
 if(a.fn)c+=a.fg?'<span class="chip ok">freigegeben</span>':'<span class="chip warn">Freigabe nötig</span>';

 let h='<section class="panel"><h3>Freigabe</h3><div class="row" role="radiogroup" aria-label="Variante zum Testen" style="margin-bottom:8px"><span class="muted" style="font-size:13px">Variante zum Testen:</span>'+
 [['knopf','A: Knopf'],['kommentar','B: Kommentar']].map(v=>'<button class="small" role="radio" aria-checked="'+(S.fv===v[0])+'" data-act="fv" data-v="'+v[0]+'"'+(S.fv===v[0]?' style="background:var(--surface-2);font-weight:600"':'')+'>'+v[1]+'</button>').join('')+'</div>';
 if(a.fg)return h+'<div class="box ok"><p><strong>Freigegeben</strong> von '+esc(pn(a.fg.von))+' am '+esc(a.fg.am)+'.</p><p class="muted" style="font-size:13px">'+(a.fg.art==='knopf'?'Name und Uhrzeit hat die App aus dem Konto eingetragen.':'Aus einem Kommentar übernommen. Man sieht, wer ihn geschrieben hat. Ob diese Person freigeben darf, prüft niemand.')+'</p></div></section>';
 if(S.fv==='knopf')h+=ok?'<p>Du darfst in diesem Bereich freigeben. Die App trägt deinen Namen und die Uhrzeit ein.</p><button class="primary" data-act="freigeben">Entwurf freigeben</button>':'<p>Freigeben dürfen hier: <strong>'+esc(wer||'niemand')+'</strong>. Der Knopf erscheint nur bei ihnen.</p>';
 else h+='<p>Freigabe als Kommentar mit festem Wortlaut:</p><p style="font-size:13px;background:var(--surface-2);padding:8px;border-radius:8px">Freigegeben: Dateiname oder Link, Stand, Name, Datum</p><p class="muted" style="font-size:13px">Unten bei den Kommentaren eintragen. Achtung: Den Wortlaut kann jede Person tippen.</p>';
 return h+'</section>'}

function vNeu(){const vs=VL.filter(v=>!S.b||v.b===S.b);const sel=S.vorlage||(vs[0]&&vs[0].id);
 return '<div class="wrap"><div class="crumb"><button class="link" data-act="nav" data-v="start">Start</button> › '+(S.b?'<button class="link" data-act="bereich" data-b="'+S.b+'">'+esc(bb(S.b).name)+'</button> › ':'')+'Neuer Vorgang</div><h1>Neuer Vorgang aus Vorlage</h1>'+
 (vs.length?'<form class="panel" data-form="neu" style="display:flex;flex-direction:column;gap:12px;max-width:560px"><label>Vorlage<select id="nv-v">'+vs.map(v=>'<option value="'+v.id+'"'+(v.id==sel?' selected':'')+'>'+esc(v.name)+' ('+esc(bb(v.b).name)+')</option>').join('')+'</select></label>'+
 '<label>Name des Vorgangs<input id="nv-t" required value="Foodtruck beim Adventsmarkt"></label><label>Datum<input id="nv-d" type="date" value="2026-12-12" required></label>'+
 '<p class="muted" style="margin:0;font-size:13px">Die App legt alle Schritte und Einsätze als Teilaufgaben an und übernimmt die Packliste. Personen trägst du danach ein, für Einsätze schlägt die App passende Leute vor.</p><button class="primary">Vorgang anlegen</button></form>':'<p>Für diesen Bereich gibt es noch keine Vorlage.</p>')+'</div>'}

function evHtml(e){const c=CAL.find(x=>x.id===e.cal);return '<div class="ev" style="--c:'+c.c+'"><time>'+(e.von?e.von+'–'+e.bis:'ganztägig')+'</time><span class="main" style="min-width:0;flex:1">'+esc(e.t)+(e.o?' <span class="muted">· '+esc(e.o)+'</span>':'')+'</span><span class="chip'+(c.pub?' pub':'')+'">'+esc(c.name)+(c.pub?' · auf der Webseite':'')+'</span></div>'}
function vKalender(){const k=konflikte();let h='<div class="wrap"><h1>Kalender</h1><p class="sub">Alle Kalender des SGDV aus Google, in einer Ansicht. Ein- und ausblenden mit den Schaltern.</p>';
 h+='<div class="row">'+CAL.map(c=>'<label class="chip" style="--c:'+c.c+';cursor:pointer;flex-direction:row;color:var(--fg)"><input type="checkbox" data-act="cal" data-c="'+c.id+'"'+(S.cals[c.id]?' checked':'')+'> <span class="dot"></span> '+esc(c.name)+'</label>').join('')+'</div>';
 h+='<div class="box" style="margin-top:12px"><p><strong>Regel:</strong> In den Kalender „Veranstaltungen“ kommt nur, was öffentlich sein soll. Alles daraus erscheint automatisch auf der Webseite. Vermietungen und interne Belegungen gehören in „Raumbelegung“.</p></div>';
 if(k.length)h+='<div class="box crit" style="margin-top:10px">'+k.map(p=>'<p><strong>Mögliche Doppelbelegung:</strong> '+fd(p[0].d)+', '+esc(p[0].o)+': „'+esc(p[0].t)+'“ ('+p[0].von+'–'+p[0].bis+') und „'+esc(p[1].t)+'“ ('+p[1].von+'–'+p[1].bis+')</p>').join('')+'</div>';
 const days=[];for(let i=0;i<14;i++){const d=new Date(2026,10,16+i);days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}
 days.forEach(d=>{const ev=E.filter(e=>e.d===d&&S.cals[e.cal]).sort((x,y)=>(x.von||'').localeCompare(y.von||''));if(!ev.length)return;
  h+='<div class="day"><h3>'+fd(d)+(d===HEUTE?' · heute':'')+'</h3>'+ev.map(evHtml).join('')+'</div>'});
 return h+'<p class="muted" style="font-size:13px;margin-top:16px">Im Urlaubskalender steht nur „abwesend“, nie ein Grund.</p></div>'}

function vZeiten(){const me=S.me,mine=V.filter(v=>v.p===me).sort((a,b)=>TAGE.indexOf(a.tag)-TAGE.indexOf(b.tag)||a.von.localeCompare(b.von));
 let h='<div class="wrap"><h1>Meine Zeiten</h1><p class="sub">Trag ein, wann du arbeitest und wann du freiwillig einspringen würdest. Eingeplant wirst du nur in diesen Zeiten, und nur mit deiner Zusage.</p>';
 h+='<section class="panel scroll"><table><thead><tr><th>Tag</th><th>Von</th><th>Bis</th><th>Art</th><th></th></tr></thead><tbody>'+(mine.length?mine.map(v=>'<tr><td>'+v.tag+'</td><td>'+v.von+'</td><td>'+v.bis+'</td><td><span class="chip'+(v.art==='fest'?'':' warn')+'">'+(v.art==='fest'?'Arbeitszeit':'freiwillig')+'</span></td><td><button class="small" data-act="zdel" data-id="'+v.id+'">Entfernen</button></td></tr>').join(''):'<tr><td colspan="5" class="muted">Noch keine Zeiten eingetragen.</td></tr>')+'</tbody></table>'+
 '<form class="inline" data-form="zeit"><label>Tag<select id="z-tag">'+TAGE.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Von<input id="z-von" type="time" value="11:00" required></label><label>Bis<input id="z-bis" type="time" value="17:00" required></label><label>Art<select id="z-art"><option value="fest">Arbeitszeit</option><option value="freiwillig">freiwillig</option></select></label><button class="primary">Hinzufügen</button></form></section>';
 h+='<h2>Zeiten im Team</h2><section class="panel scroll"><table><thead><tr><th>Person</th>'+TAGE.map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+
 P.map(p=>'<tr><td>'+esc(p.name)+'</td>'+TAGE.map(t=>{const v=V.filter(x=>x.p===p.id&&x.tag===t);return '<td style="font-size:13px;white-space:nowrap">'+v.map(x=>(x.art==='freiwillig'?'<span class="muted">':'<span>')+x.von.slice(0,2)+'–'+x.bis.slice(0,2)+(x.art==='freiwillig'?' fr.':'')+'</span>').join('<br>')+'</td>'}).join('')+'</tr>').join('')+
 '</tbody></table><p class="muted" style="font-size:13px">„fr.“ heißt freiwillig. Diese Zeiten sieht das ganze Team.</p></section></div>';
 return h}

function vRunde(){const op=A.filter(open);const sec=(t,arr,f)=>'<section class="panel"><h3>'+t+' ('+arr.length+')</h3>'+(arr.length?'<ul class="list">'+arr.map(f).join('')+'</ul>':'<p class="muted">Nichts.</p>')+'</section>';
 const vis=a=>canSee(a.b);
 let h='<div class="wrap"><h1>Büro-Runde</h1><p class="sub">Für Montag, 23.11., 10 Uhr. Die App sammelt das von selbst.</p><div class="cols">';
 h+=sec('Überfällig',op.filter(over).filter(vis),a=>aItem(a,true));
 h+=sec('Absagen dieser Woche',A.filter(a=>a.fs==='abgesagt').filter(vis),a=>'<li><div class="main"><button class="link" data-act="aufgabe" data-id="'+a.id+'">'+esc(a.t)+'</button><div class="muted" style="font-size:13px">'+esc(bb(a.b).name)+' · '+esc(pn(a.p))+' · Grund: '+esc(a.grund)+'</div></div></li>');
 h+=sec('Freigabe fehlt',op.filter(a=>a.fn&&!a.fg).filter(vis),a=>aItem(a,true));
 h+=sec('Noch ohne Person',op.filter(a=>!a.p).filter(vis),a=>aItem(a,true));
 h+=sec('Bereiche ohne Zuständige',B.filter(b=>!M.some(m=>m.b===b.id&&m.status==='aktiv'&&m.r==='zuständig')),b=>'<li><button class="link" data-act="bereich" data-b="'+b.id+'">'+esc(b.name)+'</button></li>');
 const req=M.filter(m=>m.status==='angefragt');
 h+=sec('Beitrittsanfragen (sensible Bereiche)',req,m=>'<li><div class="main">'+esc(pn(m.p))+' möchte zu <strong>'+esc(bb(m.b).name)+'</strong></div>'+(ADMINS.includes(S.me)?'<button class="small primary" data-act="bestaetigen" data-b="'+m.b+'" data-p="'+m.p+'">Bestätigen</button>':'<span class="muted" style="font-size:13px">Admin bestätigt</span>')+'</li>');
 const k=konflikte();
 h+=sec('Mögliche Doppelbelegungen',k,p=>'<li>'+fd(p[0].d)+', '+esc(p[0].o)+': '+esc(p[0].t)+' / '+esc(p[1].t)+'</li>');
 return h+'</div></div>'}

function vHilfe(){return '<div class="wrap help"><h1>So geht’s</h1><div class="cols"><section class="panel"><h3>Ein Vorgang von Anfang bis Ende</h3><ol>'+
 '<li>Eine Anfrage kommt rein, zum Beispiel über Bookings oder per E-Mail.</li><li>Die zuständige Person startet einen <strong>Vorgang aus der Vorlage</strong>. Die App legt alle Schritte an.</li>'+
 '<li>Für Einsätze schlägt die App Leute vor, deren Zeiten passen. Die Leute <strong>sagen zu oder ab</strong>.</li><li>Die KI hilft beim Vorbereiten, etwa beim Entwurf einer Antwort oder eines Vertrags. Sie verschickt nichts.</li>'+
 '<li>Was nach außen geht, braucht eine <strong>Freigabe</strong>. Erst danach wird es verschickt.</li><li>Wer ausfällt: Alles steht in der Aufgabe. Eine andere Person kann weitermachen.</li></ol>'+
 '<p><button class="link" data-act="aufgabe" data-id="'+ft.id+'">Beispiel ansehen: Foodtruck beim Nachbarschaftsfest</button></p></section>'+
 '<section class="panel"><h3>Wörter kurz erklärt</h3><p><strong>Freigabe:</strong> Eine Person, die das darf, sagt: Dieser Entwurf darf so raus.</p><p><strong>Übergabe:</strong> In der Aufgabe steht alles Wichtige. So kann eine andere Person weitermachen.</p>'+
 '<p><strong>Vollmacht:</strong> Der Vorstand erlaubt einer Person schriftlich, für den Verein zu unterschreiben, zum Beispiel einen Mietvertrag nach Vorlage.</p><p><strong>Zusage:</strong> Niemand wird fest eingeplant, ohne selbst zuzusagen.</p>'+
 '<h3 style="margin-top:14px">Was die KI macht und was nicht</h3><p>Sie liest, sortiert, rechnet und schreibt Entwürfe und Checklisten. Sie entscheidet nichts, verschickt nichts und unterschreibt nichts. Das machen Menschen.</p></section></div></div>'}

function render(){let v;
 if(!S.me)v=vLogin();
 else v=header()+({start:vStart,bereich:vBereich,aufgabe:vAufgabe,neu:vNeu,kalender:vKalender,zeiten:vZeiten,runde:vRunde,hilfe:vHilfe}[S.view]||vStart)();
 $('#app').innerHTML=v}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.type==='checkbox')return;
 const d=el.dataset,act=d.act,a=S.a&&A.find(x=>x.id===S.a);
 if(act==='login'){S.me=d.p;go('start')}
 else if(act==='logout'){S.me=null;go('login')}
 else if(act==='nav')go(d.v);
 else if(act==='bell'){S.bell=!S.bell;render()}
 else if(act==='bereich')go('bereich',{b:d.b,tab:'aufgaben'});
 else if(act==='aufgabe')go('aufgabe',{a:+d.id});
 else if(act==='tab'){S.tab=d.t;S.form='';render()}
 else if(act==='form'){S.form=S.form===d.f?'':d.f;render()}
 else if(act==='neu')go('neu',{b:d.b||null,vorlage:d.v?+d.v:null});
 else if(act==='join'){const b=bb(d.b);
  if(b.s){M.push({b:b.id,p:S.me,r:'zuständig',f:true,seit:HEUTE,status:'angefragt'});toast('Anfrage gestellt. Ein Admin bestätigt sie.')}
  else{M.push({b:b.id,p:S.me,r:'zuständig',f:true,seit:HEUTE,status:'aktiv'});toast('Du bist jetzt zuständig für '+b.name+'.')}render()}
 else if(act==='bestaetigen'){const m=M.find(x=>x.b===d.b&&x.p===d.p&&x.status==='angefragt');if(m)m.status='aktiv';toast('Bestätigt. In echt bekommt die Person jetzt Zugang zur geschützten Seite.');render()}
 else if(act==='nehme'){a.p=S.me;a.z=isEinsatz(a)?'zugesagt':'';if(a.fs==='offen')a.fs='arbeit';toast('Übernommen.');render()}
 else if(act==='zusage'){const t=A.find(x=>x.id===+d.id);t.z=d.z;toast(d.z==='zugesagt'?'Zugesagt. Danke!':'Abgesagt. Die zuständige Person sieht das.');render()}
 else if(act==='anfragen'){a.p=d.p;a.z='angefragt';toast(pn(d.p)+' wurde angefragt und bekommt einen Hinweis.');render()}
 else if(act==='fv'){S.fv=d.v;render()}
 else if(act==='freigeben'){a.fg={von:S.me,am:now(),art:'knopf'};toast('Freigegeben.');render()}
 else if(act==='zdel'){const i=V.findIndex(x=>x.id===+d.id);if(i>-1)V.splice(i,1);render()}
 else if(act==='neueVorlage'){VL.push({id:VL.length+1,b:d.b,name:'Ablauf '+bb(d.b).name,items:[]});S.tab='ablaeufe';render()}
});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset,a=S.a&&A.find(x=>x.id===S.a);
 if(d.act==='fs'&&a){a.fs=el.value;toast('Fortschritt: '+FS[el.value]);render()}
 else if(d.act==='pack'&&a){a.pack[+d.i].ok=el.checked;render()}
 else if(d.act==='cal'){S.cals[d.c]=el.checked?1:0;render()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=f.dataset,a=S.a&&A.find(x=>x.id===S.a),val=id=>(document.getElementById(id)||{}).value;
 if(d.form==='kommentar'){const t=val('km').trim();if(!t)return;a.k.push({p:S.me,t,am:now()});
  if(a.fn&&!a.fg&&S.fv==='kommentar'&&/^Freigegeben:/i.test(t)){a.fg={von:S.me,am:now(),art:'kommentar'};toast('Als Freigabe übernommen.')}render()}
 else if(d.form==='absage'){a.fs='abgesagt';a.grund=val('ab-g');S.form='';toast('Abgesagt. Steht jetzt in der Übersicht für die Runde.');render()}
 else if(d.form==='punkt'){const v=VL.find(x=>x.id===+d.v);v.items.push({typ:val('pt-typ-'+v.id),t:val('pt-text-'+v.id),von:S.me});toast('Ergänzt. Danke!');render()}
 else if(d.form==='aufgabe'){const art=val('na-art'),ein=['Einsatz','Theke'].includes(art),dd=val('na-d');
  const n=T({t:val('na-t'),b:d.b,parent:d.parent?+d.parent:null,art,frist:dd,datum:ein?dd:'',von:ein?val('na-von'):'',bis:ein?val('na-bis'):''});
  S.form='';toast('Angelegt.');if(!d.parent)go('aufgabe',{a:n.id});else render()}
 else if(d.form==='neu'){const v=VL.find(x=>x.id===+val('nv-v')),dd=val('nv-d');
  const par=T({t:val('nv-t'),b:v.b,p:S.me,frist:dd,fs:'arbeit',fn:true,notiz:'Angelegt aus der Vorlage „'+v.name+'“.',pack:v.items.filter(i=>i.typ==='Packliste').map(i=>({t:i.t,ok:false}))});
  if(!par.pack.length)par.pack=null;
  v.items.filter(i=>i.typ==='Schritt'||i.typ==='Anforderung').forEach(i=>T({t:(i.typ==='Anforderung'?'Klären: ':'')+i.t,b:v.b,parent:par.id,frist:dd}));
  v.items.filter(i=>i.typ==='Einsatz').forEach(i=>T({t:i.t,b:v.b,parent:par.id,art:'Einsatz',datum:dd,von:'14:00',bis:'18:00',frist:dd}));
  toast('Vorgang mit '+A.filter(x=>x.parent===par.id).length+' Teilaufgaben angelegt.');go('aufgabe',{a:par.id})}
 else if(d.form==='zeit'){V.push({id:vid++,p:S.me,tag:val('z-tag'),von:val('z-von'),bis:val('z-bis'),art:val('z-art')});toast('Zeit eingetragen.');render()}
});
render();
</script>
